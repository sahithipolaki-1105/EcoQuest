<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>EcoQuest – Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}"/>
</head>
<body class="auth-body">
<div class="auth-bg">
  <div class="leaf leaf1">🍃</div><div class="leaf leaf2">🌿</div>
  <div class="leaf leaf3">🍀</div><div class="leaf leaf4">🌱</div>
  <div class="leaf leaf5">🌳</div><div class="leaf leaf6">🍃</div>
</div>
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🌍</div>
      <h1 class="auth-title">Join EcoQuest</h1>
      <p class="auth-subtitle">Start your eco-warrior journey today!</p>
    </div>
    {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}
    <form method="POST" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" name="name" placeholder="Your full name" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">📧</span>
          <input type="email" name="email" placeholder="you@example.com" required/>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" name="password" placeholder="Create a password" required minlength="6"/>
        </div>
      </div>
      <button type="submit" class="btn-primary btn-full">
        🌱 Create Account
      </button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
